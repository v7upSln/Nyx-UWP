[package]
name = "nyx-adblock"
version = "0.0.1"
edition = "2021"
description = "Nyx Spike 0: C ABI wrapper around Brave's adblock-rust engine"
license = "MPL-2.0"

[lib]
name = "nyx_adblock"
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false drops `single-thread`, which makes Engine Send + Sync
# (safe to call from any thread, e.g. the stress test on the thread pool).
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

serde_json = "1"

[profile.release]
panic = "abort"      # unwinding across the FFI boundary is not supported
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"
